# This file deploys a Vite app to Firebase Hosting using pnpm
# Generated and adjusted for pnpm + GitHub Actions

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 📥 Clonar repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 📦 Configurar pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 🟢 Configurar Node (recomendado)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 📦 Instalar dependencias
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 🏗️ Build Vite
      - name: Build project
        run: pnpm run build

      # 🚀 Deploy a Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STORE_APPS_47F06 }}
          channelId: live
          projectId: store-apps-47f06
